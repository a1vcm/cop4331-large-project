name: mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  go_router: ^14.2.0 # navigation between screens, works cleanly on web too
  google_fonts: ^6.2.1 # loads Montserrat at runtime, no font files needed
  http: ^1.6.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.1 # opens resource links externally (Safari/in-app browser)

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Shared brand imagery, copied from frontend/src/assets (keep in sync if
  # the web app's images change):
  #   ucfcampus.png -> assets/images/homepage_hero_bg.png
  #   ponds.jpg     -> assets/images/about_hero_bg.jpg
  #   ucflogos.png  -> assets/images/ucf_logo.png (seal)
  #   logo.png      -> assets/images/ucf_wordmark.png (hero wordmark)
  #   knightrate_mark.webp -> assets/images/knightrate_mark.png (nav bar mark)
  assets:
    - assets/images/
